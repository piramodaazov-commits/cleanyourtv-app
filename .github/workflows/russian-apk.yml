
name: Build Russian APK

on:
  push:
    branches:
      - russian-translation-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply Russian translations
        run: |
          unzip -o cleanyourtv-russian-resources-final-1.zip -d .

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleFullDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CleanYourTV-Russian-APK
          path: app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
